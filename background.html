<!DOCTYPE html>
<html>
    <head>
        <title>Forced Puzzles Dashboard/Controls</title>
        <link rel="stylesheet" type="text/css" href="css.css">
    </head>
    <body>
        <h2>Close this page to stop forcing yourself to do puzzles</h2><br /><br />
        <p><label for="time">Time between popups (In ms, updates on popup): </label>
        <input type="number" id="time" name="time" value="420000"></p>
        <p><label for="pause">Paused: </label><input type="checkbox" id="pause" name="pause"></p>
        <p><label for="site">Puzzle site: </label><select id="site" name="site">
            <option value="1">Lichess</option>
            <option value="2">Chess.com</option>
            <option value="3">Woogles (Scrabble)</option>
        </select></p>
        <script src="run.js"></script>
    </body>
</html>
